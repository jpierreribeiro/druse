# The gate, in public.
#
# Everything this repository claims rests on `build/check.sh`, and until now it
# ran only on a developer's machine and in a pre-push hook. That is a real
# guarantee with no public evidence: a reader had to take the word of a README
# for it. This workflow is the same script, on someone else's computer.
#
# It runs the WHOLE gate rather than a fast subset, deliberately. A cheaper job
# would create two rulers -- the weak one visible and the strong one private --
# and the visible one is the one people come to believe.
name: gate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# A newer push makes an older run pointless. Cancel it rather than paying for
# an answer about a commit nobody is waiting on.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: full gate (Linux x86-64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The toolchain is PINNED and the pin carries its own checksum, so this
      # step verifies rather than trusts. odin-version.txt is the single source:
      # if the pin moves, this moves with it and no workflow edit is needed.
      - name: Fetch the pinned Odin toolchain
        run: |
          set -euo pipefail
          release="$(sed -n 's/^release=//p' odin-version.txt)"
          asset="$(sed -n 's/^linux_amd64_asset=//p' odin-version.txt)"
          want="$(sed -n 's/^linux_amd64_sha256=//p' odin-version.txt)"
          test -n "$release" && test -n "$asset" && test -n "$want"
          echo "pin: $release / $asset"
          curl -fsSL -o "$asset" \
            "https://github.com/odin-lang/Odin/releases/download/$release/$asset"
          got="$(sha256sum "$asset" | cut -d' ' -f1)"
          if [ "$want" != "$got" ]; then
            echo "::error::toolchain checksum mismatch. want $want, got $got"
            exit 1
          fi
          mkdir -p "$HOME/odin"
          tar -xzf "$asset" -C "$HOME/odin" --strip-components=1
          chmod +x "$HOME/odin/odin"
          "$HOME/odin/odin" version

      # `check.sh` needs clang to link its runnable checks and refuses to start
      # without it; python3 backs the mutation controls and the summarisers.
      - name: Tools the gate requires
        run: |
          set -euo pipefail
          clang --version | head -1
          python3 --version

      - name: build/check.sh
        env:
          DRUSE_ODIN_BIN: ${{ github.workspace }}/../odin/odin
        run: |
          set -euo pipefail
          export DRUSE_ODIN_BIN="$HOME/odin/odin"
          bash build/check.sh

  # WHAT THIS JOB PROVES, and it is the opposite of what it was written to prove.
  #
  # It was added expecting green: "the library compiles on macOS and Windows,
  # even if nothing else is tested there". The first run said otherwise --
  # vendor/odin-http imports `core:sys/linux` and stands up an io_uring loop per
  # lane, so the build stops at `sched_yield` and `setsockopt_base`. Druse is
  # Linux by CONSTRUCTION, not by lack of testing.
  #
  # So the job stays, inverted in meaning: it is the executable proof of the
  # README's platform claim. If a future transport makes these pass, that is a
  # signal worth having, and the README sentence should change with it.
  portability:
    name: does not build (${{ matrix.os }}), by construction
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # STILL NON-BLOCKING, but for a smaller reason than before. The job now
    # asserts its own expected outcome, so a red here is a real signal -- either
    # the platform claim went stale, or the third-party action and the UNPINNED
    # nightly it needs broke. Only the second is noise, and it is the reason the
    # flag stays: infrastructure for platforms this project does not pin must
    # not redden a commit whose gate is green.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin (nightly, unpinned on this platform)
        uses: laytan/setup-odin@v2
        with:
          release: latest

      # Deliberately narrower than the Linux job, and the narrowness is the
      # point: a green here means "it builds", not "it works". Claiming more
      # from a compile would be the kind of overreach the README's platform
      # section exists to avoid.
      # THE EXPECTED OUTCOME IS A COMPILE FAILURE, so the step asserts it.
      #
      # Naming the job "does not build" while still letting a failed compile
      # fail the job leaves two permanently red squares on every run, and two
      # permanent reds are how people learn to stop reading the third. The red
      # was the CORRECT verdict, which is exactly why it must not look like an
      # incident.
      #
      # So this passes when the build fails, and FAILS when the build succeeds
      # -- because a success would mean the transport no longer binds
      # core:sys/linux, the README's platform sentence has gone stale, and
      # somebody should find that out from CI rather than from a bug report.
      # THE EXPECTED OUTCOME IS A COMPILE FAILURE, and it must fail for the
      # RIGHT REASON. The first version of this step asserted only that the
      # build failed, and on Windows it "passed" because `-out:hello` is missing
      # an extension there -- a bug in this workflow, not a portability limit.
      # It never reached a single line of Druse. Every mutation control in
      # build/ checks the diagnostic and not just the exit status; so does this.
      - name: Assert the library does NOT build here, for the documented reason
        shell: bash
        run: |
          set -uo pipefail
          out="hello"
          [ "${{ runner.os }}" = "Windows" ] && out="hello.exe"

          if odin build examples/01-hello-world -collection:druse=. -out:"$out" 2>build.log; then
            echo "::error::examples/01-hello-world COMPILED on ${{ matrix.os }}."
            echo "::error::Good news and a stale document: README's Platform section says Druse is"
            echo "::error::Linux by construction because vendor/odin-http binds core:sys/linux."
            echo "::error::Re-check that claim and update it before flipping this job green-on-build."
            exit 1
          fi

          echo "--- the build failed, as the Platform section states. Diagnostic: ---"
          cat build.log

          # The documented cause is the Linux syscall surface the vendored
          # transport binds. Anything else means this job is reporting a broken
          # runner, a bad flag or a missing toolchain as if it were portability.
          if grep -qE "is not declared by 'linux'|core:sys/linux|sched_yield|setsockopt_base" build.log; then
            echo "cause matches the documented one: the transport binds Linux syscalls."
          else
            echo "::error::The build failed, but NOT for the reason the README documents."
            echo "::error::This job would have reported a workflow bug as a portability limit."
            echo "::error::Fix the step, or update the Platform section to match reality."
            exit 1
          fi
